<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AES DevTools</title>
    <style>
      /* CSS变量定义 */
      :root {
        /* Vue DevTools 浅色主题（默认）*/
        --bg: #ffffff;
        --bg-secondary: #f8f9fa;
        --panel: #ffffff;
        --panel-hover: #f1f3f4;
        --text: #2c3e50;
        --text-secondary: #606060;
        --muted: #8e8e93;
        --accent: #42b883;
        --accent-dark: #369870;
        --accent-light: #4fc08d;
        --border: #e1e4e8;
        --border-light: #d1d5da;
        --danger: #e74c3c;
        --success: #42b883;
        --warning: #f39c12;
        --info: #3498db;
        --shadow: rgba(0, 0, 0, 0.1);
        --transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
      }

      /* 深色主题 */
      [data-theme="dark"] {
        --bg: #1e1e1e;
        --bg-secondary: #252526;
        --panel: #2d2d30;
        --panel-hover: #37373a;
        --text: #cccccc;
        --text-secondary: #a9a9a9;
        --muted: #969696;
        --accent: #42b883;
        --accent-dark: #369870;
        --accent-light: #4fc08d;
        --border: #3c3c3c;
        --border-light: #464647;
        --danger: #f48771;
        --success: #42b883;
        --warning: #e6cc77;
        --info: #64b5f6;
        --shadow: rgba(0, 0, 0, 0.3);
        --transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
      }

      /* 基础样式 */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        transition: var(--transition);
      }

      /* 主容器 */
      #app {
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      /* 标题栏 */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 3px var(--shadow);
      }

      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }

      .logo {
        width: 24px;
        height: 24px;
      }

      .header-controls {
        display: flex;
        gap: 8px;
      }

      .theme-toggle, .help-btn {
        background: var(--bg-secondary);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        transition: var(--transition);
        font-size: 12px;
      }

      .theme-toggle:hover, .help-btn:hover {
        background: var(--panel-hover);
      }

      /* 主标签页 */
      .main-tabs {
        display: flex;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .tab-btn {
        padding: 12px 20px;
        background: var(--panel);
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: var(--transition);
        font-size: 13px;
        font-weight: 500;
      }

      .tab-btn:hover {
        background: var(--panel-hover);
        color: var(--text);
      }

      .tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      /* 面板 */
      .panel {
        display: none;
        flex: 1;
        overflow: hidden;
      }

      .panel.active {
        display: flex;
        flex-direction: column;
      }

      /* 工具栏 */
      .toolbar {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 3px var(--shadow);
        flex-wrap: nowrap;
        overflow-x: hidden;
        min-height: 48px;
      }

      .toolbar-left, .toolbar-right {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .toolbar-left {
        flex: 1;
        overflow-x: auto;
      }

      .toolbar input[type="text"], .toolbar select {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
      }

      .toolbar input[type="text"] {
        min-width: 200px;
        max-width: 300px;
      }

      .toolbar select {
        min-width: 80px;
      }

      .toolbar label {
        white-space: nowrap;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .toolbar button {
        white-space: nowrap;
        padding: 6px 8px;
        font-size: 12px;
        background: var(--bg-secondary);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
        transition: var(--transition);
      }

      .toolbar button:hover {
        background: var(--panel-hover);
      }

      /* 网络统计 */
      .network-stats {
        display: flex;
        gap: 16px;
        padding: 8px 12px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .stat-label {
        color: var(--text-secondary);
      }

      .stat-value {
        font-weight: 600;
        color: var(--text);
      }

      .stat-value.success {
        color: var(--success);
      }

      .stat-value.error {
        color: var(--danger);
      }

      /* 搜索历史 */
      .search-history-container {
        position: relative;
      }

      .search-history-btn {
        background: var(--accent);
        color: white;
        border: none;
        padding: 6px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      .search-history-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        box-shadow: 0 4px 12px var(--shadow);
        min-width: 200px;
        z-index: 1000;
        display: none;
      }

      .search-history-dropdown.show {
        display: block;
      }

      .search-history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
      }

      .clear-history-btn {
        background: none;
        border: none;
        color: var(--danger);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 6px;
      }

      .search-history-list {
        max-height: 200px;
        overflow-y: auto;
      }

      .search-history-item {
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
        border-bottom: 1px solid var(--border-light);
      }

      .search-history-item:hover {
        background: var(--panel-hover);
      }

      /* 网络请求表格 */
      .network-table {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .table-header {
        display: grid;
        grid-template-columns: 80px 1fr 100px 120px 100px;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .table-rows {
        flex: 1;
        overflow-y: auto;
      }

      .request-item {
        display: grid;
        grid-template-columns: 80px 1fr 100px 120px 100px;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
        transition: var(--transition);
      }

      .request-item:hover {
        background: var(--panel-hover);
      }

      .request-item.selected {
        background: var(--accent-light);
        color: white;
      }

      .request-method {
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
      }

      .request-method.success {
        color: var(--success);
      }

      .request-method.error {
        color: var(--danger);
      }

      .request-method.pending {
        color: var(--warning);
      }

      .request-url {
        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .request-status {
        font-weight: 600;
        font-size: 11px;
      }

      .request-status.success {
        color: var(--success);
      }

      .request-status.error {
        color: var(--danger);
      }

      .request-time {
        font-size: 11px;
        color: var(--text-secondary);
      }

      .request-decrypted {
        font-size: 10px;
        color: var(--success);
        background: var(--success);
        color: white;
        padding: 2px 6px;
        border-radius: 10px;
        text-align: center;
      }

      /* 存储管理 */
      .storage-container {
        display: flex;
        height: 100%;
      }

      .storage-sidebar {
        width: 300px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }

      .storage-tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
      }

      .storage-tab {
        flex: 1;
        padding: 8px 12px;
        background: var(--panel);
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition: var(--transition);
        font-size: 12px;
      }

      .storage-tab:hover {
        background: var(--panel-hover);
        color: var(--text);
      }

      .storage-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .storage-toolbar {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 6px;
      }

      .storage-toolbar button {
        padding: 4px 8px;
        font-size: 11px;
        background: var(--bg-secondary);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }

      .storage-toolbar button:hover {
        background: var(--panel-hover);
      }

      .storage-list {
        flex: 1;
        overflow-y: auto;
      }

      .storage-item {
        padding: 8px 12px;
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
        transition: var(--transition);
      }

      .storage-item:hover {
        background: var(--panel-hover);
      }

      .storage-item.selected {
        background: var(--accent-light);
        color: white;
      }

      .storage-key {
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .storage-value {
        font-size: 11px;
        color: var(--text-secondary);
        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        word-break: break-all;
      }

      .storage-actions {
        margin-top: 4px;
        display: flex;
        gap: 4px;
      }

      .storage-actions button {
        padding: 2px 6px;
        font-size: 10px;
        background: var(--bg-secondary);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 3px;
        cursor: pointer;
      }

      .storage-actions button:hover {
        background: var(--panel-hover);
      }

      .storage-detail {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
      }

      .detail-placeholder {
        text-align: center;
        color: var(--muted);
        padding: 40px;
        font-size: 14px;
      }

      .storage-editor {
        max-width: 600px;
      }

      .storage-editor h3 {
        margin-top: 0;
        margin-bottom: 16px;
        color: var(--text);
      }

      .editor-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-group label {
        font-weight: 600;
        font-size: 12px;
        color: var(--text);
      }

      .form-group input, .form-group textarea {
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        font-size: 11px;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .btn-primary, .btn-secondary {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: var(--transition);
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-primary:hover {
        background: var(--accent-dark);
      }

      .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: var(--panel-hover);
      }

      /* 上下文菜单 */
      .context-menu {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        box-shadow: 0 4px 12px var(--shadow);
        padding: 4px 0;
        z-index: 10000;
        display: none;
        min-width: 150px;
      }

      .context-menu.show {
        display: block;
      }

      .context-menu-item {
        padding: 8px 16px;
        cursor: pointer;
        font-size: 12px;
        transition: var(--transition);
      }

      .context-menu-item:hover {
        background: var(--panel-hover);
      }

      /* 帮助模态框 */
      .help-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 10000;
      }

      .help-modal.show {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .help-content {
        background: var(--panel);
        border-radius: 8px;
        padding: 24px;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 8px 32px var(--shadow);
      }

      .help-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .help-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        margin: 0;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: var(--text-secondary);
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        color: var(--text);
      }

      /* 通知 */
      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 16px;
        border-radius: 4px;
        color: white;
        font-size: 12px;
        z-index: 10000;
        display: none;
        max-width: 300px;
      }

      .notification.info {
        background: var(--info);
      }

      .notification.success {
        background: var(--success);
      }

      .notification.warning {
        background: var(--warning);
      }

      .notification.error {
        background: var(--danger);
      }

      /* 滚动条 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--border-light);
      }

      /* 响应式设计 */
      @media (max-width: 768px) {
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        
        .toolbar-left, .toolbar-right {
          justify-content: center;
        }
        
        .network-stats {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <!-- 主容器 -->
    <div id="app">
      <!-- 标题栏 -->
      <div class="header">
        <div class="title">
          <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTEyIDJMMiA3VjE3TDEyIDIyTDIyIDE3VjdMMTIgMloiIHN0cm9rZT0iIzQyQjg4MyIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPHBhdGggZD0iTTIgMTdMMTIgMjJMMjIgMTciIHN0cm9rZT0iIzQyQjg4MyIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KPHBhdGggZD0iTTIgN0wxMiAxMkwyMiA3IiBzdHJva2U9IiM0MkI4ODMiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=" alt="AES" class="logo">
          <span>AES DevTools</span>
        </div>
        <div class="header-controls">
          <button class="theme-toggle" title="切换主题">
            <span class="theme-icon">🌙</span>
          </button>
          <button class="help-btn" title="使用帮助">?</button>
        </div>
      </div>

      <!-- 主标签页 -->
      <div class="main-tabs">
        <button class="tab-btn active" data-tab="network">网络监控</button>
        <button class="tab-btn" data-tab="storage">存储管理</button>
      </div>

      <!-- 网络监控面板 -->
      <div id="network-panel" class="panel active">
        <!-- 工具栏 -->
        <div class="toolbar">
          <div class="toolbar-left">
            <input type="text" id="filter" placeholder="搜索请求..." class="search-input">
            <select id="method-filter">
              <option value="">所有方法</option>
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="DELETE">DELETE</option>
              <option value="PATCH">PATCH</option>
            </select>
            <select id="status-filter">
              <option value="">所有状态</option>
              <option value="200">200 OK</option>
              <option value="404">404 Not Found</option>
              <option value="500">500 Error</option>
            </select>
            <label>
              <input type="checkbox" id="auto-decrypt" checked>
              自动解密
            </label>
            <label>
              <input type="checkbox" id="show-decrypted" checked>
              显示解密结果
            </label>
            <!-- 搜索历史按钮 -->
            <div class="search-history-container">
              <button id="searchHistoryBtn" class="search-history-btn" title="搜索历史">📋</button>
              <div id="searchHistoryDropdown" class="search-history-dropdown">
                <div class="search-history-header">
                  <span>搜索历史</span>
                  <button id="clearSearchHistory" class="clear-history-btn">清空</button>
                </div>
                <div id="searchHistoryList" class="search-history-list">
                  <!-- 搜索历史项将在这里动态生成 -->
                </div>
              </div>
            </div>
          </div>
          <div class="toolbar-right">
            <button id="clear-btn">清空</button>
            <button id="export-btn">导出</button>
            <button id="batch-decrypt-btn">批量解密</button>
          </div>
        </div>

        <!-- 网络统计 -->
        <div class="network-stats">
          <div class="stat-item">
            <span class="stat-label">总请求:</span>
            <span class="stat-value" id="total-requests">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">成功:</span>
            <span class="stat-value success" id="success-requests">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">失败:</span>
            <span class="stat-value error" id="failed-requests">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">已解密:</span>
            <span class="stat-value" id="decrypted-requests">0</span>
          </div>
        </div>

        <!-- 网络请求表格 -->
        <div class="network-table">
          <div class="table-header">
            <div>方法</div>
            <div>URL</div>
            <div>状态</div>
            <div>时间</div>
            <div>状态</div>
          </div>
          <div class="table-rows" id="rows">
            <!-- 网络请求行将在这里动态生成 -->
          </div>
        </div>
      </div>

      <!-- 存储管理面板 -->
      <div id="storage-panel" class="panel">
        <div class="storage-container">
          <div class="storage-sidebar">
            <div class="storage-tabs">
              <button class="storage-tab active" data-storage="localStorage">localStorage</button>
              <button class="storage-tab" data-storage="sessionStorage">sessionStorage</button>
            </div>
            <div class="storage-toolbar">
              <button id="add-storage-item">添加</button>
              <button id="import-storage">导入</button>
              <button id="export-storage">导出</button>
              <button id="clear-storage">清空</button>
            </div>
            <div class="storage-list" id="storage-list">
              <!-- 存储项将在这里动态生成 -->
            </div>
          </div>
          <div class="storage-detail" id="storage-detail">
            <div class="detail-placeholder">
              选择一个存储项查看详情
            </div>
          </div>
        </div>
      </div>
